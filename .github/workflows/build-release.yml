name: Build Windows release

# Builds the one-click Windows executable. Runs on demand and whenever a version
# tag (e.g. v0.2.0) is pushed; on a tag it attaches the .exe to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Build executable
        run: pyinstaller --noconfirm --clean packaging/melanopsin_gui.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MelanopsinModel-windows
          path: dist/MelanopsinModel-v*.exe
          if-no-files-found: error

      - name: Attach executable to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MelanopsinModel-v*.exe
          generate_release_notes: true
