name: Build release

# Builds the one-click Windows executable and both macOS .app bundles. Runs on
# demand and whenever a version tag (e.g. v0.2.0) is pushed; on a tag it
# attaches the binaries to a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Build executable
        run: pyinstaller --noconfirm --clean packaging/melanopsin_gui.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MelanopsinModel-windows
          path: dist/MelanopsinModel-v*.exe
          if-no-files-found: error

  build-macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify Tkinter
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Build macOS app
        run: pyinstaller --noconfirm --clean packaging/melanopsin_gui.spec

      - name: Zip macOS app
        run: |
          shopt -s nullglob
          apps=(dist/MelanopsinModel-v*.app)
          if [[ ${#apps[@]} -eq 0 ]]; then
            echo "No .app found in dist/" >&2
            exit 1
          fi
          app="${apps[0]}"
          zip_name="$(basename "${app%.app}").zip"
          (cd dist && ditto -c -k --keepParent "$(basename "$app")" "$zip_name")
          echo "Created dist/$zip_name"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MelanopsinModel-macos-arm64
          path: dist/MelanopsinModel-v*-macos-arm64.zip
          if-no-files-found: error

  build-macos-x86_64:
    runs-on: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify Tkinter
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-build.txt

      - name: Build macOS app
        run: pyinstaller --noconfirm --clean packaging/melanopsin_gui.spec

      - name: Zip macOS app
        run: |
          shopt -s nullglob
          apps=(dist/MelanopsinModel-v*.app)
          if [[ ${#apps[@]} -eq 0 ]]; then
            echo "No .app found in dist/" >&2
            exit 1
          fi
          app="${apps[0]}"
          zip_name="$(basename "${app%.app}").zip"
          (cd dist && ditto -c -k --keepParent "$(basename "$app")" "$zip_name")
          echo "Created dist/$zip_name"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MelanopsinModel-macos-x86_64
          path: dist/MelanopsinModel-v*-macos-x86_64.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-macos-arm64, build-macos-x86_64]
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Attach binaries to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
